# SPA static serving inside the web container.
# /api is proxied to the Django Account backend so auth cookies stay same-origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Django backend. "host.docker.internal" reaches the host machine from the
    # container (Docker Desktop). Point this at the API service name instead
    # once the backend joins the same compose network.
    location /api/ {
        proxy_pass http://host.docker.internal:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
