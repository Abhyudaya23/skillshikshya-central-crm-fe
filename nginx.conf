# SPA static serving inside the web container.
# /api is proxied to the Django Account backend so auth cookies stay same-origin.

# The backend sets JWTs as httpOnly cookies but authenticates requests only via
# the Authorization header, so lift the access_token cookie into that header.
map $cookie_access_token $jwt_auth {
    ""      $http_authorization;
    default "Bearer $cookie_access_token";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Django backend. VITE_API_URL comes from .env via docker-compose and is
    # substituted at container startup (nginx envsubst templates). Defaults to
    # host.docker.internal:8188, which reaches the host machine (Docker Desktop).
    location /api/ {
        proxy_pass ${VITE_API_URL};
        proxy_set_header Authorization $jwt_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
